version: '3.8'

services:

  shared-logging-builder:
    build:
      context: ./shared-logging
    container_name: shared-logging-builder
    volumes:
      - maven-repo:/root/.m2
    command: mvn clean install -DskipTests

  studio-db:
    image: mysql:8.0
    container_name: studio-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studiodb
    ports:
      - "3307:3306"
    volumes:
      - studio-db-data:/var/lib/mysql
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio-service:
    build:
      context: ./studio
    container_name: studio-service
    depends_on:
      shared-logging-builder:
        condition: service_completed_successfully
      studio-db:
        condition: service_healthy
    volumes:
      - maven-repo:/root/.m2
      - ./logs/studio:/logs               # logs accessibles localement
    ports:
      - "8081:8081"
    environment:
      LOG_DIR: /logs
      SPRING_DATASOURCE_URL: jdbc:mysql://studio-db:3306/studiodb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - micro-network

  film-db:
    image: mongo:5.0
    container_name: film-db
    ports:
      - "27017:27017"
    volumes:
      - film-db-data:/data/db
    networks:
      - micro-network

  film-service:
    build:
      context: ./films
    container_name: film-service
    depends_on:
      shared-logging-builder:
        condition: service_completed_successfully
      film-db:
        condition: service_started
    volumes:
      - maven-repo:/root/.m2
      - ./logs/films:/logs               # logs accessibles localement
    ports:
      - "8082:8082"
    environment:
      LOG_DIR: /logs
      SPRING_DATA_MONGODB_URI: mongodb://film-db:27017/filmsdb
    networks:
      - micro-network

volumes:
  studio-db-data:
  film-db-data:
  maven-repo:

networks:
  micro-network:
